      btnReset.addEventListener('click', () => {
        rainActive = false;
        btnRain.classList.remove('active');
        initEffects();
      });

      // --- Physics Loop ---
      const dropArray = new Float32Array(MAX_DROPS * 4);
      const deformArray = new Float32Array(MAX_DROPS * 4);
      const colorArray = new Float32Array(MAX_DROPS * 3);

      function isOverText(x, y, r) {
        for (let i = 0; i < textLineBoxes.length; i++) {
          const b = textLineBoxes[i];
          if (x + r > b.x && x - r < b.x + b.w && y + r > b.y && y - r < b.y + b.h) {
            return true;
          }
        }
        return false;
      }

      function stepPhysics(dt, timeSec) {
        const targetPress = pointer.isDown ? 1.0 : 0.0;
        pointer.pressStrength += (targetPress - pointer.pressStrength) * (1.0 - Math.exp(-16.0 * dt));

        // Update Page Flip Animation
        if (pageFlip.active) {
          pageFlip.progress += dt * 2.5;
          if (pageFlip.progress >= 1.0) {
            pageFlip.active = false;
            pageFlip.progress = 0;
          }
        }

        // Intro auto-penning character-by-character
        if (introTypingActive) {
          introCharTimer += dt;
          const charInterval = 0.055;
          while (introTypingActive && introCharTimer >= charInterval) {
            introCharTimer -= charInterval;
            if (introCharIndex < initialPromptText.length) {
              const ch = initialPromptText[introCharIndex];
              editor.value += ch;
              pages[currentPageIdx].text = editor.value;
              prevText = editor.value;
              charInks.push(0.0);
              if (/[\s\n]/.test(ch) && showBubbles && Math.random() < 0.45) {
                spawnItem();
              }
              introCharIndex++;
              paperDirty = true;
            } else {
              introTypingActive = false;
            }
          }
        }

        for (let i = 0; i < charInks.length; i++) {
          if (charInks[i] < 1.0) {
            charInks[i] = Math.min(1.0, charInks[i] + dt * 2.1);
            paperDirty = true;
          }
        }

        for (let i = burnGlyphs.length - 1; i >= 0; i--) {
          burnGlyphs[i].age += dt;
          paperDirty = true;
          if (burnGlyphs[i].age >= burnGlyphs[i].duration) burnGlyphs.splice(i, 1);
        }

        for (let i = smokeParticles.length - 1; i >= 0; i--) {
          const sp = smokeParticles[i];
          sp.age += dt;
          sp.x += sp.vx * dt + Math.sin(timeSec * 4.0 + i) * 6.0 * dt;
          sp.y += sp.vy * dt;
          sp.vx *= 0.96;
          paperDirty = true;
          if (sp.age >= sp.life) smokeParticles.splice(i, 1);
        }

        if (!showBubbles) return;

        if (rainActive) {
          rainTimer += dt;
          if (rainTimer > 0.09) {
            rainTimer = 0;
            spawnFountainSprinkle();
          }
        }

        if (wiper.intervalSec > 0 && !wiper.sweeping) {
          wiper.timer += dt;
          if (wiper.timer >= wiper.intervalSec) triggerWiperSweep();
        }

        const pivotX = width * 0.5;
        const pivotY = height - 44;
        const bladeLen = Math.hypot(width * 0.54, height * 0.85);
        const startAng = -Math.PI * 0.90;
        const endAng = -Math.PI * 0.10;

        if (wiper.sweeping) {
          wiper.progress += dt * 1.45;
          if (wiper.progress >= 1.0) {
            wiper.sweeping = false;
            wiper.progress = 0;
            wiper.angle = startAng;
          } else {
            const p = wiper.progress;
            const t = p < 0.5 ? p * 2.0 : (1.0 - p) * 2.0;
            const eased = t * t * (3.0 - 2.0 * t);
            wiper.angle = startAng + (endAng - startAng) * eased;

            const sweepDir = p < 0.5 ? 1 : -1;
            const tipX = pivotX + Math.cos(wiper.angle) * bladeLen;
            const tipY = pivotY + Math.sin(wiper.angle) * bladeLen;

            for (let i = drops.length - 1; i >= 0; i--) {
              const d = drops[i];
              const pax = d.x - pivotX;
              const pay = d.y - pivotY;
              const bax = tipX - pivotX;
              const bay = tipY - pivotY;
              const h = Math.max(0, Math.min(1, (pax * bax + pay * bay) / (bax * bax + bay * bay)));
              const dist = Math.hypot(pax - bax * h, pay - bay * h);
              if (dist < d.r + 14) {
                if (Math.random() < 0.72) drops.splice(i, 1);
                else {
                  const tangentAng = wiper.angle + sweepDir * Math.PI * 0.5;
                  d.vx = Math.cos(tangentAng) * 14;
                  d.vy = Math.sin(tangentAng) * 14;
                }
              }
            }
            for (let i = magicParticles.length - 1; i >= 0; i--) {
              const m = magicParticles[i];
              const pax = m.x - pivotX;
              const pay = m.y - pivotY;
              const bax = tipX - pivotX;
              const bay = tipY - pivotY;
              const h = Math.max(0, Math.min(1, (pax * bax + pay * bay) / (bax * bax + bay * bay)));
              const dist = Math.hypot(pax - bax * h, pay - bay * h);
              if (dist < m.size + 14) magicParticles.splice(i, 1);
            }
          }
          wiper.alpha = Math.min(1.0, wiper.alpha + dt * 10.0);
        } else {
          wiper.alpha = Math.max(0.0, wiper.alpha - dt * 6.0);
        }

        if (effectMode !== 'water') {
          const driftSpeed = 0.25 + waterSpeed * 1.4;
          for (let i = 0; i < magicParticles.length; i++) {
            const m = magicParticles[i];
            m.vx += Math.sin(timeSec * 0.9 + m.phase) * 0.04 * driftSpeed;
            if (gravityEnabled) {
              m.vy += (effectMode === 'dandelions' ? 0.012 : 0.025) * driftSpeed;
            } else {
              m.vy += Math.cos(timeSec * 0.7 + m.phase) * 0.03 * driftSpeed;
            }

            if (pointer.active) {
              const dx = m.x - pointer.x;
              const dy = m.y - pointer.y;
              const dist = Math.hypot(dx, dy);
              if (dist < 65 && dist > 0.1) {
                const push = (1.0 - dist / 65) * (pointer.isDown ? 1.8 : 0.45);
                m.vx += (dx / dist) * push + pointer.vx * 0.12;
                m.vy += (dy / dist) * push + pointer.vy * 0.12;
              }
            }

            m.x += m.vx;
            m.y += m.vy;
            m.vx *= 0.95;
            m.vy *= 0.95;
            m.rot += m.rotSpeed * dt;

            if (m.x < -20) m.x = width + 15;
            if (m.x > width + 20) m.x = -15;
            if (m.y < -20) m.y = height - 65;
            if (m.y > height - 60) {
              m.y = gravityEnabled ? -10 : height - 60;
              if (!gravityEnabled) m.vy *= -0.6;
            }
          }
          pointer.vx *= 0.8;
          pointer.vy *= 0.8;
          return;
        }

        if (pointer.isDown && pointer.grabbedDrop && !pointer.splashedThisPress) {
          const heldMs = performance.now() - pointer.downTime;
          if (heldMs > 300 && pointer.movedDist < 14) {
            splashDrop(pointer.grabbedDrop, pointer.x, pointer.y, 1.15);
            pointer.grabbedDrop = null;
            pointer.splashedThisPress = true;
          }
        }

        const windDrive = waterSpeed * 0.24;
        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          if (d.mergeCooldown > 0) d.mergeCooldown -= dt;

          let isBeingPressed = false;
          const stickingToText = isOverText(d.x, d.y, d.r);

          const sway = Math.sin(timeSec * 0.7 + d.y * 0.01) * 0.03;
          d.vx += sway;
          if (waterSpeed > 0.05) {
            d.vy -= windDrive * (0.5 + d.r * 0.012);
            d.vx += Math.sin(timeSec * 0.4 + d.x * 0.005) * windDrive * 0.35;
          }
          if (gravityEnabled) {
            const gravScale = Math.max(0.02, (d.r - 4) * 0.006);
            d.vy += gravScale;
          }

          if (pointer.active) {
            const dx = d.x - pointer.x;
            const dy = d.y - pointer.y;
            const dist = Math.hypot(dx, dy);

            if (pointer.isDown) {
              if (pointer.grabbedDrop === d) {
                isBeingPressed = true;
                const targetX = pointer.x + pointer.grabOffsetX * 0.55;
                const targetY = pointer.y + pointer.grabOffsetY * 0.55;
                d.vx += (targetX - d.x) * 0.30;
                d.vy += (targetY - d.y) * 0.30;
                d.vx *= 0.74;
                d.vy *= 0.74;
              } else if (dist < d.r + 34) {
                isBeingPressed = dist < d.r * 1.05;
                const nx = dist > 0.01 ? dx / dist : 1;
                const ny = dist > 0.01 ? dy / dist : 0;
                const push = (1.0 - dist / (d.r + 34)) * 2.1;
                d.vx += nx * push + pointer.vx * 0.14;
                d.vy += ny * push + pointer.vy * 0.14;
              }
            } else {
              const pSpeed = Math.hypot(pointer.vx, pointer.vy);
              if (dist < d.r + 22 && pSpeed > 0.5) {
                const factor = (1.0 - dist / (d.r + 22)) * 0.22;
                d.vx += pointer.vx * factor;
                d.vy += pointer.vy * factor;
              }
            }
          }

          const targetDropPress = isBeingPressed ? 1.0 : 0.0;
          const pressForce = (targetDropPress - d.press) * 180.0 - d.pressVel * 14.0;
          d.pressVel += pressForce * dt;
          d.press = Math.max(0.0, Math.min(1.35, d.press + d.pressVel * dt));

          const pressedRadius = d.targetR * (1.0 + d.press * 0.24);
          d.r += (pressedRadius - d.r) * (1.0 - Math.exp(-18.0 * dt));

          let friction = d.r < 14 ? 0.90 : 0.94;
          if (stickingToText && !isBeingPressed) friction *= 0.84;

          d.x += d.vx;
          d.y += d.vy;
          d.vx *= friction;
          d.vy *= friction;

          const pad = d.r + 4;
          if (d.x < pad) { d.x = pad; d.vx = Math.abs(d.vx) * 0.5; }
          else if (d.x > width - pad) { d.x = width - pad; d.vx = -Math.abs(d.vx) * 0.5; }

          if (d.y < -d.r && waterSpeed > 0.2) {
            d.y = height - 70;
            d.x = 30 + Math.random() * (width - 60);
          } else if (d.y < pad && waterSpeed <= 0.2) {
            d.y = pad;
            d.vy = Math.abs(d.vy) * 0.5;
          } else if (d.y > height - pad - 56) {
            d.y = height - pad - 56;
            d.vy = -Math.abs(d.vy) * 0.4;
          }

          const speed = Math.hypot(d.vx, d.vy);
          if (speed > 0.25) {
            const targetAngle = Math.atan2(d.vy, d.vx);
            let diff = targetAngle - d.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            d.angle += diff * 0.24;
          }

          const targetStretch = 1.08 + Math.min(0.30, speed * 0.025);
          const stretchForce = (targetStretch - d.stretch) * 200.0 - d.stretchVel * 12.0;
          d.stretchVel += stretchForce * dt;
          d.stretch = Math.max(0.85, Math.min(1.42, d.stretch + d.stretchVel * dt));
        }

        for (let i = 0; i < drops.length; i++) {
          for (let j = i + 1; j < drops.length; j++) {
            const a = drops[i];
            const b = drops[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            const sumR = a.r + b.r;

            if (dist < sumR * 0.72 && a.mergeCooldown <= 0 && b.mergeCooldown <= 0) {
              const mA = Math.pow(a.targetR, 2.2);
              const mB = Math.pow(b.targetR, 2.2);
              const totalM = mA + mB;

              const newR = Math.min(110, Math.pow(totalM, 1 / 2.2));
              a.x = (a.x * mA + b.x * mB) / totalM;
              a.y = (a.y * mA + b.y * mB) / totalM;
              a.vx = (a.vx * mA + b.vx * mB) / totalM;
              a.vy = (a.vy * mA + b.vy * mB) / totalM;
              a.targetR = newR;

              a.color = [
                (a.color[0] * mA + b.color[0] * mB) / totalM,
                (a.color[1] * mA + b.color[1] * mB) / totalM,
                (a.color[2] * mA + b.color[2] * mB) / totalM
              ];

              a.press = Math.max(a.press, b.press);
              a.stretch = 1.22;

              if (pointer.grabbedDrop === b) {
                pointer.grabbedDrop = a;
                pointer.grabOffsetX = a.x - pointer.x;
                pointer.grabOffsetY = a.y - pointer.y;
              }

              drops.splice(j, 1);
              j--;
            }
          }
        }

        pointer.vx *= 0.8;
        pointer.vy *= 0.8;
      }

      function render() {
        if (paperDirty) renderPaperTexture();

        const count = (showBubbles && effectMode === 'water') ? Math.min(drops.length, MAX_DROPS) : 0;
        for (let i = 0; i < count; i++) {
          const d = drops[i];
          const i4 = i * 4;
          const i3 = i * 3;

          dropArray[i4]     = d.x * dpr;
          dropArray[i4 + 1] = d.y * dpr;
          dropArray[i4 + 2] = d.r * dpr;
          dropArray[i4 + 3] = 0;

          deformArray[i4]     = d.angle;
          deformArray[i4 + 1] = d.stretch;
          deformArray[i4 + 2] = d.press;
          deformArray[i4 + 3] = 0;

          colorArray[i3]     = d.color[0];
          colorArray[i3 + 1] = d.color[1];
          colorArray[i3 + 2] = d.color[2];
        }

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, paperTex);
        gl.uniform1i(uPaperTex, 0);

        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uDpr, dpr);
        gl.uniform1i(uCount, count);
        gl.uniform4fv(uDrops, dropArray);
        gl.uniform4fv(uDeform, deformArray);
        gl.uniform3fv(uColors, colorArray);
        gl.uniform4f(
          uPointer,
          pointer.x * dpr,
          pointer.y * dpr,
          pointer.pressStrength,
          20.0 * dpr
        );

        const pivotX = width * 0.5 * dpr;
        const pivotY = (height - 44) * dpr;
        const bladeLen = Math.hypot(width * 0.54, height * 0.85) * dpr;
        const tipX = pivotX + Math.cos(wiper.angle) * bladeLen;
        const tipY = pivotY + Math.sin(wiper.angle) * bladeLen;
        gl.uniform4f(uWiper, pivotX, pivotY, tipX, tipY);
        gl.uniform1f(uWiperActive, wiper.alpha);
        gl.uniform1f(uIsParchment, currentTheme === 'riddle' ? 1.0 : 0.0);

        gl.drawArrays(gl.TRIANGLES, 0, 6);
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;
        const timeSec = now * 0.001;
        stepPhysics(dt, timeSec);
        render();
        renderOverlayCanvas(timeSec, false);
        requestAnimationFrame(loop);
      }

      buildPaperGrain();
      resize();
      initEffects();
      updatePageControls();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { paperDirty = true; });
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
