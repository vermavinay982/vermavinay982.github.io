<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policies - Extension Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #0969da;
            padding-bottom: 10px;
            margin-top: 0;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            display: block;
            padding: 15px;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            color: #0969da;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s, border-color 0.2s;
        }
        a:hover {
            background-color: #f0f3f6;
            border-color: #0969da;
        }
        .file-icon {
            margin-right: 10px;
            color: #57606a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Privacy Policies</h1>
        <p>Select an extension to view its privacy policy:</p>
        
        <!-- Static List based on current repository files -->
        <ul id="policy-list">
            <li>
                <a href="ext_eisenhower.html">
                    <span class="file-icon">📄</span> ext_eisenhower.html
                </a>
            </li>
            <li>
                <a href="ext_library.html">
                    <span class="file-icon">📄</span> ext_library.html
                </a>
            </li>
            <li>
                <a href="ext_magicwand.html">
                    <span class="file-icon">📄</span> ext_magicwand.html
                </a>
            </li>
        </ul>

      <!-- <ul>
            {% for file in site.static_files %}
                {% if file.path contains '/blog/privacy_policies/' and file.extname == '.html' and file.name != 'index.html' %}
                <li>
                    <a href="{{ site.baseurl }}{{ file.path }}">
                        <span class="file-icon">📄</span> {{ file.name }}
                    </a>
                </li>
                {% endif %}
            {% endfor %}
        </ul> -->
    </div>
</body>
</html>
